<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i>
                <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CHI DOI CHAT</span>
            </div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Group</a>
                <a href="profile.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="settings.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-gear"></i> Settings</a>
                <button onclick="auth.logout()" class="text-rose-400 hover:text-rose-300 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">
        <section class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
            <h2 class="text-2xl font-bold text-cyan-400 border-b border-slate-700 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-id-card"></i> Hồ Sơ Người Dùng
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block mb-1">Name Play / Tên Hiển Thị</span>
                    <span id="prof-display-name" class="font-bold text-cyan-300 text-base"></span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block mb-1">Tên Đăng Nhập</span>
                    <span id="prof-username" class="font-medium text-slate-200 text-base"></span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block mb-1">Email / Gmail</span>
                    <span id="prof-email" class="font-medium text-slate-200 text-base"></span>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 block mb-1">Số Điện Thoại</span>
                    <span id="prof-phone" class="font-medium text-slate-200 text-base"></span>
                </div>
            </div>

            <div class="pt-2">
                <label class="block text-xs text-slate-400 mb-2">Icon / Avatar FontAwesome (ví dụ: fa-solid fa-ghost)</label>
                <div class="flex gap-2">
                    <input type="text" id="prof-icon-input" class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm flex-1 focus:border-cyan-500 outline-none">
                    <button onclick="auth.updateAvatar()" class="bg-cyan-600 hover:bg-cyan-500 px-5 py-3 rounded-lg text-sm font-semibold transition">
                        Cập nhật
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = db.getSession();
            if (!user) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('prof-display-name').innerText = user.displayName;
                document.getElementById('prof-username').innerText = user.username;
                document.getElementById('prof-email').innerText = user.email;
                document.getElementById('prof-phone').innerText = user.phone;
                document.getElementById('prof-icon-input').value = user.icon || 'fa-solid fa-user-ninja';
            }
        });
    </script>
</body>
</html>
