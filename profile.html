<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i>
                <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CHI DOI CHAT</span>
            </div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Group</a>
                <a href="profile.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="settings.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-gear"></i> Settings</a>
                <button onclick="auth.logout()" class="text-rose-400 hover:text-rose-300 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <!-- Main Profile Section -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center my-6">
        <section class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                <h2 class="text-2xl font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen"></i> Chỉnh Sửa Hồ Sơ Cá Nhân
                </h2>
                <div class="text-xs bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full border border-cyan-800">
                    Security Level 5
                </div>
            </div>

            <!-- Form Chỉnh Sửa Tất Cả Thông Tin -->
            <form onsubmit="auth.updateFullProfile(event)" class="space-y-4">
                
                <!-- Avatar Preview & Icon Class -->
                <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 flex items-center gap-4">
                    <div class="w-14 h-14 bg-cyan-950 border border-cyan-500/50 rounded-full flex items-center justify-center text-cyan-400 text-2xl shadow-inner">
                        <i id="prof-icon-preview" class="fa-solid fa-user-ninja"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Icon Avatar (FontAwesome Class)</label>
                        <input type="text" id="prof-icon-input" oninput="auth.previewIcon(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-cyan-500 outline-none">
                    </div>
                </div>

                <!-- Tên hiển thị / Name play -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Name Play / Tên Hiển Thị *</label>
                    <input type="text" id="prof-display-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <!-- Tên đăng nhập -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tên Đăng Nhập *</label>
                    <input type="text" id="prof-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <!-- Email / Gmail -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email / Gmail *</label>
                    <input type="email" id="prof-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <!-- Số điện thoại -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Số Điện Thoại *</label>
                    <input type="tel" id="prof-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <!-- Đổi mật khẩu mới -->
                <div class="pt-2 border-t border-slate-700/60">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mật Khẩu Mới <span class="text-slate-500 font-normal">(Bỏ trống nếu không muốn đổi)</span></label>
                    <input type="password" id="prof-new-password" placeholder="Tối thiểu 12 ký tự: HOA, thường, số, đặc biệt" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <!-- Thông báo Lỗi / Thành công -->
                <div id="prof-msg" class="text-xs p-3 rounded-lg hidden"></div>

                <!-- Nút lưu thay đổi -->
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Lưu Tất Cả Thay Đổi</span>
                </button>
            </form>
        </section>
    </main>

    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = db.getSession();
            if (!user) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('prof-display-name').value = user.displayName || user.username;
                document.getElementById('prof-username').value = user.username;
                document.getElementById('prof-email').value = user.email;
                document.getElementById('prof-phone').value = user.phone;
                document.getElementById('prof-icon-input').value = user.icon || 'fa-solid fa-user-ninja';
                document.getElementById('prof-icon-preview').className = user.icon || 'fa-solid fa-user-ninja';
            }
        });
    </script>
</body>
</html>
