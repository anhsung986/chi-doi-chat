<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Fallback bảo đảm hiển thị màu sắc -->
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .bg-cyan-950 { background-color: #083344 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        .text-slate-100 { color: #f8fafc !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .border-slate-700 { border-color: #334155 !important; }
        .border-cyan-800 { border-color: #155e75 !important; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
            background-color: #0f172a !important; color: #ffffff !important; border: 1px solid #334155 !important; border-radius: 0.5rem;
        }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        button { cursor: pointer; }
        a { text-decoration: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i>
                <span class="font-bold text-xl text-cyan-400">CHI DOI CHAT</span>
            </div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Group</a>
                <a href="profile.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="settings.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-gear"></i> Settings</a>
                <button onclick="auth.logout()" class="text-rose-400 hover:text-rose-300 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center my-6">
        <section class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                <h2 class="text-2xl font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen"></i> Chỉnh Sửa Hồ Sơ Cá Nhân
                </h2>
                <div class="text-xs bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full border border-cyan-800">
                    Security Level 5
                </div>
            </div>

            <form onsubmit="auth.updateFullProfile(event)" class="space-y-4">
                
                <div class="p-5 bg-slate-900 rounded-xl border border-slate-700 flex flex-col items-center justify-center gap-3 text-center">
                    <label class="block text-xs font-semibold text-slate-400">Ảnh Đại Diện (Tự động nén & lưu lên Firebase)</label>

                    <div onclick="document.getElementById('prof-file-input').click()" class="relative group cursor-pointer w-24 h-24 rounded-full overflow-hidden border-2 border-cyan-500 bg-slate-800 flex items-center justify-center shadow-lg transition transform hover:scale-105">
                        <div id="prof-avatar-preview-box" class="w-full h-full flex items-center justify-center text-cyan-400 text-4xl">
                            <i class="fa-solid fa-user-ninja"></i>
                        </div>
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center text-white text-xs gap-1">
                            <i class="fa-solid fa-camera text-lg text-cyan-400"></i>
                            <span>Đổi ảnh</span>
                        </div>
                    </div>

                    <button type="button" onclick="document.getElementById('prof-file-input').click()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-slate-200 transition flex items-center gap-2">
                        <i class="fa-solid fa-image text-cyan-400"></i>
                        <span>Chọn ảnh từ điện thoại / máy tính</span>
                    </button>
                    <input type="file" id="prof-file-input" accept="image/*" onchange="auth.handleFileSelect(event)" class="hidden">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Name Play / Tên Hiển Thị *</label>
                    <input type="text" id="prof-display-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tên Đăng Nhập *</label>
                    <input type="text" id="prof-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email / Gmail *</label>
                    <input type="email" id="prof-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Số Điện Thoại *</label>
                    <input type="tel" id="prof-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
                </div>

                <div class="pt-2 border-t border-slate-700">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mật Khẩu Mới <span class="text-slate-500 font-normal">(Bỏ trống nếu không muốn đổi)</span></label>
                    <input type="password" id="prof-new-password" placeholder="Tối thiểu 12 ký tự: HOA, thường, số, đặc biệt" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
                </div>

                <div id="prof-msg" class="text-xs p-3 rounded-lg hidden"></div>

                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Lưu Tất Cả Thay Đổi</span>
                </button>
            </form>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = db.getSession();
            if (!user) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('prof-display-name').value = user.displayName || user.username;
                document.getElementById('prof-username').value = user.username;
                document.getElementById('prof-email').value = user.email;
                document.getElementById('prof-phone').value = user.phone;
                
                auth.renderAvatarPreview(user.icon || 'fa-solid fa-user-ninja');
            }
        });
    </script>
</body>
</html>
