<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i>
                <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CHI DOI CHAT</span>
            </div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Group</a>
                <a href="profile.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="settings.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-gear"></i> Settings</a>
                <button onclick="auth.logout()" class="text-rose-400 hover:text-rose-300 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">
        <section class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
            <h2 class="text-2xl font-bold text-cyan-400 border-b border-slate-700 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved"></i> Cài Đặt Bảo Mật Cấp 5
            </h2>

            <div class="space-y-3 text-xs">
                <div class="flex justify-between items-center p-3.5 bg-slate-900 rounded-lg border border-slate-700/50">
                    <span>Mã hóa tin nhắn AES-GCM 256-bit</span>
                    <span class="text-emerald-400 font-bold">KÍCH HOẠT</span>
                </div>
                <div class="flex justify-between items-center p-3.5 bg-slate-900 rounded-lg border border-slate-700/50">
                    <span>Mã hóa Mật khẩu SHA-256 Web Crypto</span>
                    <span class="text-emerald-400 font-bold">KÍCH HOẠT</span>
                </div>
                <div class="flex justify-between items-center p-3.5 bg-slate-900 rounded-lg border border-slate-700/50">
                    <span>Cơ chế Zero-Server Database</span>
                    <span class="text-cyan-400 font-bold">TỐI CAO (5)</span>
                </div>
            </div>

            <button onclick="db.clearAllData()" class="w-full bg-rose-900/40 hover:bg-rose-900 border border-rose-700 text-rose-200 py-3 rounded-lg font-semibold text-sm transition">
                <i class="fa-solid fa-trash-can mr-2"></i>Xóa Sạch Dữ Liệu Cục Bộ (Purge DB)
            </button>
        </section>
    </main>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!db.getSession()) window.location.href = 'login.html';
        });
    </script>
</body>
</html>
