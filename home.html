<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHI DOI CHAT - Trang Chủ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"] { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; border-radius: 0.5rem; }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        [data-theme="emerald"] .text-cyan-400 { color: #34d399 !important; }
        [data-theme="emerald"] .bg-cyan-600 { color: #fff !important; background-color: #059669 !important; }
        [data-theme="rose"] .text-cyan-400 { color: #fb7185 !important; }
        [data-theme="rose"] .bg-cyan-600 { color: #fff !important; background-color: #e11d48 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-screen overflow-hidden">
    <!-- Header Desktop -->
    <header class="hidden md:flex bg-slate-800 border-b border-slate-700 h-16 shrink-0 items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex items-center justify-between">
            <div class="flex items-center space-x-3"><i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i><span class="font-bold text-xl text-cyan-400">CHI DOI CHAT</span></div>
            <nav class="flex items-center space-x-5">
                <button onclick="switchTab('group')" class="text-cyan-400 font-medium text-sm flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-comments"></i> Chat Nhóm</button>
                <button onclick="switchTab('private')" class="hover:text-cyan-400 text-sm flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-user-group"></i> Chat Riêng</button>
                <button onclick="switchTab('profile')" class="hover:text-cyan-400 text-sm flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-user"></i> Cá Nhân</button>
                <button onclick="switchTab('settings')" class="hover:text-cyan-400 text-sm flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-gear"></i> Cài Đặt</button>
                <button onclick="auth.logout()" class="text-rose-400 text-sm ml-2 cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-2 md:p-4 flex gap-4 h-[calc(100vh-4rem)] md:h-[calc(100vh-4rem)] pb-16 md:pb-4 overflow-hidden relative">
        <!-- Sidebar trái: Trên mobile sẽ ẩn đi nếu đang mở khung chat để tránh chật chội -->
        <aside id="main-sidebar" class="w-full md:w-80 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl h-full shrink-0">
            <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                <span id="sidebar-title" class="font-bold text-xs uppercase text-slate-400">Thành Viên Trực Tuyến</span>
                <span id="friends-count" class="text-xs bg-cyan-950 text-cyan-400 px-2.5 py-0.5 rounded-full border border-cyan-800">0</span>
            </div>
            <div id="friends-list" class="flex-1 overflow-y-auto p-2 space-y-1.5"></div>
        </aside>

        <!-- Khung hiển thị nội dung bên phải -->
        <section id="main-chat-section" class="w-full md:flex-1 flex flex-col bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl h-full min-h-0 relative hidden md:flex">
            <div class="p-3 border-b border-slate-700 flex justify-between items-center shrink-0 bg-slate-900/50">
                <div class="flex items-center gap-2">
                    <!-- Nút quay lại trên mobile khi đang trong phòng chat -->
                    <button onclick="mobileBackToSidebar()" class="md:hidden text-cyan-400 text-base px-2 py-1 cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                    <div>
                        <h3 id="room-title" class="font-bold text-sm text-cyan-400"><i class="fa-solid fa-comments"></i> PHÒNG CHAT NHÓM CHUNG</h3>
                        <div id="private-actions" class="hidden flex items-center gap-2 mt-1.5">
                            <button id="btn-nickname" class="text-[11px] bg-slate-900 border border-slate-700 text-cyan-400 px-2 py-0.5 rounded-lg cursor-pointer"><i class="fa-solid fa-pen"></i> Đổi Biệt Danh</button>
                            <button id="btn-love" class="text-[11px] bg-rose-950 border border-rose-800 text-rose-400 px-2 py-0.5 rounded-lg cursor-pointer"><i class="fa-solid fa-heart"></i> Mời Người Yêu ❤️</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Khu vực nội dung động -->
            <div id="dynamic-content-area" class="flex-1 flex flex-col min-h-0 overflow-hidden">
                <div id="chat-messages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 bg-slate-900 min-h-0"></div>
                <form id="chat-form-container" onsubmit="chat.sendMessage(event)" class="p-2.5 bg-slate-800 border-t border-slate-700 flex gap-2 items-center shrink-0">
                    <button type="button" onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-2.5 rounded-lg border border-slate-700 cursor-pointer"><i class="fa-solid fa-image"></i></button>
                    <input type="text" id="chat-input" placeholder="Nhập tin nhắn bảo mật..." class="flex-1 px-3 py-2.5 text-sm outline-none">
                    <button type="submit" class="bg-cyan-600 text-white px-4 py-2.5 rounded-lg font-medium cursor-pointer"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </section>
    </main>

    <!-- Bảng Menu 3 gạch ẩn (Popup) -->
    <div id="messenger-menu-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-slate-800 w-full md:w-96 rounded-t-3xl md:rounded-2xl border border-slate-700 p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <span class="font-bold text-sm text-cyan-400"><i class="fa-solid fa-bars"></i> Menu Tùy Chỉnh</span>
                <button onclick="toggleMessengerMenu()" class="text-slate-400 hover:text-white px-2 py-1 text-sm cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-1.5">
                <div class="text-[11px] font-bold text-slate-400 uppercase">Đổi chủ đề màu sắc</div>
                <button onclick="chat.setTheme('cyan'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-cyan-400 flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-circle text-[10px]"></i> Xanh Cyan (Mặc định)</button>
                <button onclick="chat.setTheme('emerald'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-emerald-400 flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-circle text-[10px]"></i> Xanh Ngọc (Emerald)</button>
                <button onclick="chat.setTheme('rose'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-rose-400 flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-circle text-[10px]"></i> Hồng Rose</button>
            </div>
            <div class="border-t border-slate-700 pt-2 space-y-1.5">
                <button onclick="switchTab('profile'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-slate-200 flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-user text-cyan-400"></i> Xem Trang Cá Nhân</button>
                <button onclick="switchTab('settings'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-slate-200 flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-gear text-cyan-400"></i> Cài Đặt Hệ Thống</button>
                <button onclick="auth.logout()" class="w-full py-2.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-400 font-medium text-xs flex items-center justify-center gap-2 cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất tài khoản</button>
            </div>
        </div>
    </div>

    <!-- Thanh điều hướng dưới chuẩn 4 nút Messenger (Dành riêng cho Mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 h-16 flex justify-around items-center z-40 px-2 shadow-2xl">
        <button onclick="switchTab('group')" id="nav-btn-group" class="flex flex-col items-center justify-center flex-1 text-cyan-400 py-1 cursor-pointer">
            <div class="w-10 h-7 bg-cyan-950/60 rounded-full flex items-center justify-center border border-cyan-800/50"><i class="fa-solid fa-comments text-base"></i></div>
            <span class="text-[10px] font-semibold mt-0.5">Đoạn chat</span>
        </button>
        <button onclick="switchTab('private')" id="nav-btn-private" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1 cursor-pointer">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-user-group text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Mọi người</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1 cursor-pointer">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-user text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Cá nhân</span>
        </button>
        <button onclick="toggleMessengerMenu()" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1 cursor-pointer">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-bars text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Menu</span>
        </button>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script>
        let currentMode = 'group';
        const currentUser = db.getSession();

        function toggleMessengerMenu() {
            document.getElementById('messenger-menu-modal').classList.toggle('hidden');
        }

        function updateNavHighlight(mode) {
            ['group', 'private', 'profile'].forEach(m => {
                const btn = document.getElementById('nav-btn-' + m);
                if (btn) {
                    if (m === mode) {
                        btn.className = "flex flex-col items-center justify-center flex-1 text-cyan-400 py-1 cursor-pointer";
                        btn.querySelector('div').className = "w-10 h-7 bg-cyan-950/60 rounded-full flex items-center justify-center border border-cyan-800/50";
                    } else {
                        btn.className = "flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1 cursor-pointer";
                        btn.querySelector('div').className = "w-10 h-7 rounded-full flex items-center justify-center";
                    }
                }
            });
        }

        function mobileOpenChat() {
            if (window.innerWidth < 768) {
                document.getElementById('main-sidebar').style.display = 'none';
                document.getElementById('main-chat-section').style.display = 'flex';
            }
        }

        function mobileBackToSidebar() {
            if (window.innerWidth < 768) {
                document.getElementById('main-sidebar').style.display = 'flex';
                document.getElementById('main-chat-section').style.display = 'none';
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            updateNavHighlight(mode);
            const sidebar = document.getElementById('main-sidebar');
            const chatSection = document.getElementById('main-chat-section');
            const contentArea = document.getElementById('dynamic-content-area');
            const roomTitle = document.getElementById('room-title');
            const privateActions = document.getElementById('private-actions');

            privateActions.classList.add('hidden');

            // Trên mobile khi đổi tab, luôn hiện sidebar trước để dễ chọn
            if (window.innerWidth < 768) {
                sidebar.style.display = 'flex';
                chatSection.style.display = 'none';
            } else {
                sidebar.style.display = 'flex';
                chatSection.style.display = 'flex';
            }

            if (mode === 'group') {
                roomTitle.innerHTML = `<i class="fa-solid fa-comments"></i> PHÒNG CHAT NHÓM CHUNG`;
                document.getElementById('sidebar-title').innerText = "Thành Viên Trực Tuyến";
                contentArea.innerHTML = `
                    <div id="chat-messages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 bg-slate-900 min-h-0"></div>
                    <form onsubmit="chat.sendMessage(event)" class="p-2.5 bg-slate-800 border-t border-slate-700 flex gap-2 items-center shrink-0">
                        <button type="button" onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-2.5 rounded-lg border border-slate-700 cursor-pointer"><i class="fa-solid fa-image"></i></button>
                        <input type="text" id="chat-input" placeholder="Nhập tin nhắn bảo mật..." class="flex-1 px-3 py-2.5 text-sm outline-none">
                        <button type="submit" class="bg-cyan-600 text-white px-4 py-2.5 rounded-lg font-medium cursor-pointer"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                `;
                chat.switchRoom('group');
                loadGroupUsers();
            } else if (mode === 'private') {
                roomTitle.innerHTML = `<i class="fa-solid fa-user-group"></i> Chọn đối phương để nhắn riêng`;
                document.getElementById('sidebar-title').innerText = "Chọn Bạn Chat 1-1";
                contentArea.innerHTML = `
                    <div id="chat-messages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 bg-slate-900 min-h-0"><div class="text-center text-slate-500 py-10 text-xs">Vui lòng chọn một người dùng bên danh sách để bắt đầu trò chuyện riêng tư</div></div>
                    <form onsubmit="chat.sendMessage(event)" class="p-2.5 bg-slate-800 border-t border-slate-700 flex gap-2 items-center shrink-0">
                        <button type="button" id="img-btn" disabled onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-2.5 rounded-lg border border-slate-700 disabled:opacity-50 cursor-pointer"><i class="fa-solid fa-image"></i></button>
                        <input type="text" id="chat-input" disabled placeholder="Chọn người dùng..." class="flex-1 px-3 py-2.5 text-sm outline-none disabled:opacity-50">
                        <button type="submit" id="chat-btn" disabled class="bg-cyan-600 text-white px-4 py-2.5 rounded-lg font-medium disabled:opacity-50 cursor-pointer"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                `;
                loadPrivateUsers();
            } else if (mode === 'profile') {
                sidebar.style.display = 'none';
                chatSection.style.display = 'flex';
                roomTitle.innerHTML = `<i class="fa-solid fa-user-gear"></i> TRANG CÁ NHÂN & TÀI KHOẢN`;
                contentArea.innerHTML = `
                    <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-900 flex flex-col items-center justify-center">
                        <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
                            <div class="flex flex-col items-center space-y-2 text-center pb-4 border-b border-slate-700">
                                <div class="w-16 h-16 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-cyan-400 text-3xl">
                                    <i class="${currentUser.icon || 'fa-solid fa-shield-cat'}"></i>
                                </div>
                                <h2 class="text-lg font-bold text-white">${SecurityEngine.sanitizeHTML(currentUser.displayName || currentUser.username)}</h2>
                                <p class="text-xs text-slate-400">ID: ${currentUser.id}</p>
                            </div>
                            <div class="space-y-3 text-xs">
                                <div><span class="text-slate-400 block mb-1">Tên tài khoản (Username):</span><input type="text" disabled value="${currentUser.username}" class="w-full px-3 py-2 opacity-75"></div>
                                <div><span class="text-slate-400 block mb-1">Email liên kết:</span><input type="text" disabled value="${currentUser.email || 'Chưa cập nhật'}" class="w-full px-3 py-2 opacity-75"></div>
                                <div><span class="text-slate-400 block mb-1">Số điện thoại:</span><input type="text" disabled value="${currentUser.phone || 'Chưa cập nhật'}" class="w-full px-3 py-2 opacity-75"></div>
                            </div>
                            <button onclick="alert('Tính năng đổi thông tin chi tiết đang được bảo mật cấp 5.')" class="w-full py-2.5 bg-cyan-600 text-white font-medium rounded-xl text-xs hover:bg-cyan-500 transition-colors cursor-pointer">Cập Nhật Thông Tin</button>
                        </div>
                    </div>
                `;
            } else if (mode === 'settings') {
                sidebar.style.display = 'none';
                chatSection.style.display = 'flex';
                roomTitle.innerHTML = `<i class="fa-solid fa-gear"></i> CÀI ĐẶT HỆ THỐNG`;
                contentArea.innerHTML = `
                    <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-900 flex flex-col items-center">
                        <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
                            <h3 class="font-bold text-sm text-cyan-400 border-b border-slate-700 pb-2">Tùy Chọn Giao Diện & Bảo Mật</h3>
                            <div class="space-y-3 text-xs">
                                <div class="flex justify-between items-center py-2 border-b border-slate-700/50">
                                    <span>Chủ đề màu sắc ứng dụng</span>
                                    <div class="flex gap-2">
                                        <button onclick="chat.setTheme('cyan')" class="w-5 h-5 rounded-full bg-cyan-500 cursor-pointer"></button>
                                        <button onclick="chat.setTheme('emerald')" class="w-5 h-5 rounded-full bg-emerald-500 cursor-pointer"></button>
                                        <button onclick="chat.setTheme('rose')" class="w-5 h-5 rounded-full bg-rose-500 cursor-pointer"></button>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center py-2 border-b border-slate-700/50">
                                    <span>Chuẩn Mã Hóa Tin Nhắn</span>
                                    <span class="text-emerald-400 font-semibold">AES-256-GCM (Cấp 5)</span>
                                </div>
                                <div class="flex justify-between items-center py-2">
                                    <span>Trạng thái kết nối Firebase</span>
                                    <span class="text-emerald-400 font-semibold">Đã kết nối Realtime</span>
                                </div>
                            </div>
                            <button onclick="auth.logout()" class="w-full py-2.5 bg-rose-950 border border-rose-800 text-rose-400 font-medium rounded-xl text-xs hover:bg-rose-900 transition-colors cursor-pointer mt-4">Đăng Xuất Phiên Làm Việc</button>
                        </div>
                    </div>
                `;
            }
        }

        function loadGroupUsers() {
            db.listenUsers((users) => {
                if (currentMode !== 'group') return;
                const list = document.getElementById('friends-list');
                list.innerHTML = '';
                document.getElementById('friends-count').innerText = users.filter(x => x.online).length;
                users.forEach(u => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-2.5 rounded-xl bg-slate-900/40 border border-slate-700/50 cursor-pointer hover:bg-slate-700/50 transition-colors';
                    item.onclick = () => {
                        chat.switchRoom('group');
                        mobileOpenChat();
                    };
                    item.innerHTML = `<div class="relative"><div class="w-8 h-8 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-cyan-400 text-xs"><i class="${u.icon || 'fa-solid fa-user'}"></i></div><span class="w-2.5 h-2.5 rounded-full ${u.online ? 'bg-emerald-400' : 'bg-slate-500'} absolute bottom-0 right-0 border-2 border-slate-800"></span></div><div class="text-xs font-semibold text-slate-200">${SecurityEngine.sanitizeHTML(u.displayName || u.username)}</div>`;
                    list.appendChild(item);
                });
            });
        }

        function loadPrivateUsers() {
            if (!currentUser) return;
            db.listenUsers((users) => {
                if (currentMode !== 'private') return;
                const list = document.getElementById('friends-list');
                list.innerHTML = '';
                document.getElementById('friends-count').innerText = users.filter(x => x.id !== currentUser.id).length;
                
                users.filter(x => x.id !== currentUser.id).forEach(target => {
                    const nick = db.getLocalNickname(target.id, target.displayName || target.username);
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-2.5 rounded-xl cursor-pointer hover:bg-slate-700/65 transition-colors';
                    item.onclick = () => {
                        const roomId = chat.getPrivateRoomId(currentUser.id, target.id);
                        document.getElementById('room-title').innerHTML = `<i class="fa-solid fa-user-lock text-cyan-400"></i> Chat Riêng: <span class="text-white">${SecurityEngine.sanitizeHTML(nick)}</span>`;
                        document.getElementById('private-actions').classList.remove('hidden');
                        document.getElementById('btn-nickname').onclick = () => chat.promptChangeNickname(target.id, target.displayName || target.username);
                        document.getElementById('btn-love').onclick = () => chat.proposeLove(target.id, nick);
                        
                        chat.switchRoom(roomId, target);
                        chat.initLoveStatusListener(target.id);
                        mobileOpenChat();
                    };
                    item.innerHTML = `<div class="relative"><div class="w-8 h-8 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-cyan-400 text-xs"><i class="${target.icon || 'fa-solid fa-user'}"></i></div><span class="w-2.5 h-2.5 rounded-full ${target.online ? 'bg-emerald-400' : 'bg-slate-500'} absolute bottom-0 right-0 border-2 border-slate-800"></span></div><div class="text-xs font-semibold text-slate-200">${SecurityEngine.sanitizeHTML(nick)}</div>`;
                    list.appendChild(item);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) {
                window.location.href = 'login.html';
            } else {
                db.initPresence(currentUser.id);
                switchTab('group');
                chat.initRealtimeListeners();
            }
        });
    </script>
</body>
</html>
