<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Group | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Navigation Bar Header -->
    <header class="bg-slate-800/90 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i>
                <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CHI DOI CHAT</span>
            </div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Group</a>
                <a href="profile.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="settings.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-gear"></i> Settings</a>
                <button onclick="auth.logout()" class="text-rose-400 hover:text-rose-300 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col justify-center">
        <section class="flex-1 flex flex-col h-[80vh] bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
            <!-- Header Kênh -->
            <div class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg text-cyan-400">CHI DOI CHAT ROOM</h3>
                    <p class="text-xs text-slate-400">Kênh truyền nhận dữ liệu mã hóa AES-GCM 256-bit thời gian thực</p>
                </div>
                <div class="text-xs bg-slate-900 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Real-time Sync
                </div>
            </div>

            <!-- Khung Tin Nhắn -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900/50"></div>

            <!-- Chỉ báo Đang viết... -->
            <div id="typing-indicator" class="px-4 py-1 text-xs text-cyan-400 italic h-6"></div>

            <!-- Form Gửi Tin Nhắn -->
            <form onsubmit="chat.sendMessage(event)" class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
                <input type="text" id="chat-input" oninput="chat.handleTyping()" placeholder="Nhập tin nhắn bảo mật AES-256..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:border-cyan-500 outline-none">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-lg font-medium transition flex items-center gap-2 shadow-md">
                    <span>Gửi</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>
    </main>

    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = db.getSession();
            if (!user) {
                window.location.href = 'login.html';
            } else {
                chat.loadHistory();
            }
        });
    </script>
</body>
</html>
