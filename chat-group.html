<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Nhóm | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        input[type="text"] { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; border-radius: 0.5rem; }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        [data-theme="emerald"] .text-cyan-400 { color: #34d399 !important; }
        [data-theme="emerald"] .bg-cyan-600 { background-color: #059669 !important; }
        [data-theme="rose"] .text-cyan-400 { color: #fb7185 !important; }
        [data-theme="rose"] .bg-cyan-600 { background-color: #e11d48 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3"><i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i><span class="font-bold text-xl text-cyan-400">CHI DOI CHAT</span></div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-users"></i> Chat Nhóm</a>
                <a href="chat-private.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-lock"></i> Chat Riêng</a>
                <button onclick="auth.logout()" class="text-rose-400 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 h-[calc(100vh-5rem)]">
        <aside class="w-full md:w-80 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl h-60 md:h-full">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center"><span class="font-bold text-sm">Thành Viên</span><span id="friends-count" class="text-xs bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-800">0</span></div>
            <div id="friends-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>
        <section class="flex-1 flex flex-col bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl h-full">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-cyan-400"><i class="fa-solid fa-users"></i> PHÒNG CHAT NHÓM</h3>
                <div class="flex gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button onclick="chat.setTheme('cyan')" class="w-4 h-4 rounded-full bg-cyan-500"></button>
                    <button onclick="chat.setTheme('emerald')" class="w-4 h-4 rounded-full bg-emerald-500"></button>
                    <button onclick="chat.setTheme('rose')" class="w-4 h-4 rounded-full bg-rose-500"></button>
                </div>
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900"></div>
            <form onsubmit="chat.sendMessage(event)" class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
                <button type="button" onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-3 rounded-lg border border-slate-700"><i class="fa-solid fa-image"></i></button>
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." class="flex-1 px-4 py-3 text-sm outline-none">
                <button type="submit" class="bg-cyan-600 text-white px-6 py-3 rounded-lg font-medium"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/chat.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { if (!db.getSession()) window.location.href='login.html'; else { chat.switchRoom('group'); chat.initRealtimeListeners(); } });</script>
</body>
</html>
