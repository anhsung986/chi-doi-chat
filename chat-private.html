<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Riêng | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        input[type="text"] { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; border-radius: 0.5rem; }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        [data-theme="emerald"] .text-cyan-400 { color: #34d399 !important; }
        [data-theme="emerald"] .bg-cyan-600 { background-color: #059669 !important; }
        [data-theme="rose"] .text-cyan-400 { color: #fb7185 !important; }
        [data-theme="rose"] .bg-cyan-600 { background-color: #e11d48 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-screen overflow-hidden">
    <!-- Header desktop -->
    <header class="hidden md:flex bg-slate-800 border-b border-slate-700 h-16 shrink-0 items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex items-center justify-between">
            <div class="flex items-center space-x-3"><i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i><span class="font-bold text-xl text-cyan-400">CHI DOI CHAT</span></div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-comments"></i> Chat Nhóm</a>
                <a href="chat-private.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-user-group"></i> Chat Riêng</a>
                <button onclick="auth.logout()" class="text-rose-400 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-2 md:p-4 flex flex-col md:flex-row gap-4 h-[calc(100vh-4rem)] md:h-[calc(100vh-4rem)] pb-16 md:pb-4 overflow-hidden">
        <aside class="w-full md:w-80 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl h-32 md:h-full shrink-0">
            <div class="p-2.5 border-b border-slate-700"><span class="font-bold text-xs uppercase text-slate-400">Chọn Bạn Chat 1-1</span></div>
            <div id="private-users-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>
        <section class="flex-1 flex flex-col bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl h-full min-h-0 relative">
            <div class="p-3 border-b border-slate-700 flex flex-wrap justify-between items-center gap-2 shrink-0">
                <div>
                    <h3 id="private-title" class="font-bold text-sm text-cyan-400"><i class="fa-solid fa-user-group"></i> Chọn đối phương để nhắn tin</h3>
                    <div id="private-actions" class="hidden flex items-center gap-2 mt-1.5">
                        <button id="btn-nickname" class="text-[11px] bg-slate-900 border border-slate-700 text-cyan-400 px-2 py-0.5 rounded-lg"><i class="fa-solid fa-pen"></i> Đổi Biệt Danh</button>
                        <button id="btn-love" class="text-[11px] bg-rose-950 border border-rose-800 text-rose-400 px-2 py-0.5 rounded-lg"><i class="fa-solid fa-heart"></i> Mời Người Yêu ❤️</button>
                    </div>
                </div>
            </div>
            <div id="chat-messages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 bg-slate-900 min-h-0"></div>
            <form onsubmit="chat.sendMessage(event)" class="p-2.5 bg-slate-800 border-t border-slate-700 flex gap-2 items-center shrink-0">
                <button type="button" id="img-btn" disabled onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-2.5 rounded-lg border border-slate-700 disabled:opacity-50"><i class="fa-solid fa-image"></i></button>
                <input type="text" id="chat-input" disabled placeholder="Chọn người dùng..." class="flex-1 px-3 py-2.5 text-sm outline-none disabled:opacity-50">
                <button type="submit" id="chat-btn" disabled class="bg-cyan-600 text-white px-4 py-2.5 rounded-lg font-medium disabled:opacity-50"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </section>
    </main>

    <!-- Bảng Menu 3 gạch ẩn (Popup) -->
    <div id="messenger-menu-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-slate-800 w-full md:w-96 rounded-t-3xl md:rounded-2xl border border-slate-700 p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <span class="font-bold text-sm text-cyan-400"><i class="fa-solid fa-bars"></i> Menu Tùy Chỉnh</span>
                <button onclick="toggleMessengerMenu()" class="text-slate-400 hover:text-white px-2 py-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-1.5">
                <div class="text-[11px] font-bold text-slate-400 uppercase">Đổi chủ đề màu sắc</div>
                <button onclick="chat.setTheme('cyan'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-circle text-[10px]"></i> Xanh Cyan (Mặc định)</button>
                <button onclick="chat.setTheme('emerald'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-circle text-[10px]"></i> Xanh Ngọc (Emerald)</button>
                <button onclick="chat.setTheme('rose'); toggleMessengerMenu();" class="w-full text-left px-3 py-2 text-xs rounded-xl bg-slate-900 hover:bg-slate-700 text-rose-400 flex items-center gap-2"><i class="fa-solid fa-circle text-[10px]"></i> Hồng Rose</button>
            </div>
            <div class="border-t border-slate-700 pt-2">
                <button onclick="auth.logout()" class="w-full py-2.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-400 font-medium text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất tài khoản</button>
            </div>
        </div>
    </div>

    <!-- Thanh điều hướng dưới chuẩn 4 nút Messenger (Dành riêng cho Mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 h-16 flex justify-around items-center z-40 px-2 shadow-2xl">
        <a href="chat-group.html" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-comments text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Đoạn chat</span>
        </a>
        <a href="chat-private.html" class="flex flex-col items-center justify-center flex-1 text-cyan-400 py-1">
            <div class="w-10 h-7 bg-cyan-950/60 rounded-full flex items-center justify-center border border-cyan-800/50"><i class="fa-solid fa-user-group text-base"></i></div>
            <span class="text-[10px] font-semibold mt-0.5">Mọi người</span>
        </a>
        <button onclick="chat.setTheme(localStorage.getItem('chat_theme') === 'rose' ? 'cyan' : 'rose')" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-palette text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Chủ đề</span>
        </button>
        <button onclick="toggleMessengerMenu()" class="flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-cyan-400 py-1">
            <div class="w-10 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-bars text-base"></i></div>
            <span class="text-[10px] font-medium mt-0.5">Menu</span>
        </button>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/chat.js"></script>
    <script>
        function toggleMessengerMenu() {
            document.getElementById('messenger-menu-modal').classList.toggle('hidden');
        }
        document.addEventListener('DOMContentLoaded', () => {
            const u = db.getSession();
            if (!u) return window.location.href = 'login.html';
            db.initPresence(u.id);
            db.listenUsers((users) => {
                const list = document.getElementById('private-users-list');
                list.innerHTML = '';
                users.filter(x => x.id !== u.id).forEach(target => {
                    const nick = db.getLocalNickname(target.id, target.displayName || target.username);
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-2.5 rounded-xl cursor-pointer hover:bg-slate-700/60';
                    item.onclick = () => {
                        const roomId = chat.getPrivateRoomId(u.id, target.id);
                        document.getElementById('private-title').innerHTML = `<i class="fa-solid fa-user-group text-cyan-400"></i> Chat Riêng: <span class="text-white">${SecurityEngine.sanitizeHTML(nick)}</span>`;
                        document.getElementById('private-actions').classList.remove('hidden');
                        document.getElementById('btn-nickname').onclick = () => chat.promptChangeNickname(target.id, target.displayName || target.username);
                        document.getElementById('btn-love').onclick = () => chat.proposeLove(target.id, nick);
                        document.getElementById('chat-input').disabled = false;
                        document.getElementById('chat-btn').disabled = false;
                        document.getElementById('img-btn').disabled = false;
                        chat.switchRoom(roomId, target);
                        chat.initLoveStatusListener(target.id);
                    };
                    item.innerHTML = `<div class="relative"><div class="w-8 h-8 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-cyan-400 text-xs"><i class="${target.icon || 'fa-solid fa-user'}"></i></div><span class="w-2.5 h-2.5 rounded-full ${target.online ? 'bg-emerald-400' : 'bg-slate-500'} absolute bottom-0 right-0 border-2 border-slate-800"></span></div><div class="text-xs font-semibold text-slate-200">${SecurityEngine.sanitizeHTML(nick)}</div>`;
                    list.appendChild(item);
                });
            });
            chat.applySavedTheme();
        });
    </script>
</body>
</html>
