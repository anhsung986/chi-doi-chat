<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Riêng | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        input[type="text"] { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; border-radius: 0.5rem; }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        [data-theme="emerald"] .text-cyan-400 { color: #34d399 !important; }
        [data-theme="emerald"] .bg-cyan-600 { background-color: #059669 !important; }
        [data-theme="rose"] .text-cyan-400 { color: #fb7185 !important; }
        [data-theme="rose"] .bg-cyan-600 { background-color: #e11d48 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3"><i class="fa-solid fa-shield-cat text-cyan-400 text-2xl"></i><span class="font-bold text-xl text-cyan-400">CHI DOI CHAT</span></div>
            <nav class="flex items-center space-x-5">
                <a href="chat-group.html" class="hover:text-cyan-400 text-sm flex items-center gap-1"><i class="fa-solid fa-users"></i> Chat Nhóm</a>
                <a href="chat-private.html" class="text-cyan-400 font-medium text-sm flex items-center gap-1"><i class="fa-solid fa-lock"></i> Chat Riêng</a>
                <button onclick="auth.logout()" class="text-rose-400 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
        </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 h-[calc(100vh-5rem)]">
        <aside class="w-full md:w-80 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col overflow-hidden shadow-2xl h-60 md:h-full">
            <div class="p-4 border-b border-slate-700"><span class="font-bold text-sm">Chọn Bạn Chat 1-1</span></div>
            <div id="private-users-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>
        <section class="flex-1 flex flex-col bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl h-full">
            <div class="p-4 border-b border-slate-700 flex flex-wrap justify-between items-center gap-2">
                <div>
                    <h3 id="private-title" class="font-bold text-base text-cyan-400"><i class="fa-solid fa-lock"></i> Chưa chọn đối phương</h3>
                    <div id="private-actions" class="hidden flex items-center gap-2 mt-2">
                        <button id="btn-nickname" class="text-xs bg-slate-900 border border-slate-700 text-cyan-400 px-2.5 py-1 rounded-lg"><i class="fa-solid fa-pen"></i> Đổi Biệt Danh</button>
                        <button id="btn-love" class="text-xs bg-rose-950 border border-rose-800 text-rose-400 px-2.5 py-1 rounded-lg"><i class="fa-solid fa-heart"></i> Mời Người Yêu ❤️</button>
                    </div>
                </div>
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900"></div>
            <form onsubmit="chat.sendMessage(event)" class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
                <button type="button" id="img-btn" disabled onclick="chat.triggerImageUpload()" class="bg-slate-900 text-cyan-400 p-3 rounded-lg border border-slate-700 disabled:opacity-50"><i class="fa-solid fa-image"></i></button>
                <input type="text" id="chat-input" disabled placeholder="Chọn người dùng để nhắn tin..." class="flex-1 px-4 py-3 text-sm outline-none disabled:opacity-50">
                <button type="submit" id="chat-btn" disabled class="bg-cyan-600 text-white px-6 py-3 rounded-lg font-medium disabled:opacity-50"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const u = db.getSession();
            if (!u) return window.location.href = 'login.html';
            db.initPresence(u.id);
            db.listenUsers((users) => {
                const list = document.getElementById('private-users-list');
                list.innerHTML = '';
                users.filter(x => x.id !== u.id).forEach(target => {
                    const nick = db.getLocalNickname(target.id, target.displayName || target.username);
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-2.5 rounded-xl cursor-pointer hover:bg-slate-700/60';
                    item.onclick = () => {
                        const roomId = chat.getPrivateRoomId(u.id, target.id);
                        document.getElementById('private-title').innerHTML = `<i class="fa-solid fa-user-lock text-cyan-400"></i> Chat Riêng: <span class="text-white">${SecurityEngine.sanitizeHTML(nick)}</span>`;
                        document.getElementById('private-actions').classList.remove('hidden');
                        document.getElementById('btn-nickname').onclick = () => chat.promptChangeNickname(target.id, target.displayName || target.username);
                        document.getElementById('btn-love').onclick = () => chat.proposeLove(target.id, nick);
                        document.getElementById('chat-input').disabled = false;
                        document.getElementById('chat-btn').disabled = false;
                        document.getElementById('img-btn').disabled = false;
                        chat.switchRoom(roomId, target);
                        chat.initLoveStatusListener(target.id);
                    };
                    item.innerHTML = `<div class="relative"><div class="w-8 h-8 bg-slate-900 border border-slate-700 rounded-full flex items-center justify-center text-cyan-400 text-xs"><i class="${target.icon || 'fa-solid fa-user'}"></i></div><span class="w-2.5 h-2.5 rounded-full ${target.online ? 'bg-emerald-400' : 'bg-slate-500'} absolute bottom-0 right-0 border-2 border-slate-800"></span></div><div class="text-xs font-semibold text-slate-200">${SecurityEngine.sanitizeHTML(nick)}</div>`;
                    list.appendChild(item);
                });
            });
            chat.applySavedTheme();
        });
    </script>
</body>
</html>
