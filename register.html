<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white">Tạo Tài Khoản Mới</h2>
            <p class="text-xs text-cyan-400 mt-1"><i class="fa-solid fa-lock mr-1"></i>Tiêu chuẩn Bảo mật Cấp 5</p>
        </div>

        <form onsubmit="auth.handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tên đăng nhập *</label>
                <input type="text" id="reg-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Mật khẩu (≥12 ký tự: HOA, thường, số, đặc biệt) *</label>
                <input type="password" id="reg-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email *</label>
                <input type="email" id="reg-email" placeholder="name@gmail.com" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Số điện thoại *</label>
                <input type="tel" id="reg-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div id="reg-error" class="text-rose-400 text-xs p-2 bg-rose-950/40 border border-rose-800/50 rounded hidden"></div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-md">
                Tạo Tài Khoản Bảo Mật
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Đã có tài khoản? <a href="login.html" class="text-cyan-400 hover:underline">Đăng nhập</a>
        </div>
    </div>

    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
