<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Fallback bảo đảm hiển thị màu sắc -->
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        .bg-slate-900 { background-color: #0f172a !important; }
        .bg-slate-800 { background-color: #1e293b !important; }
        .bg-cyan-600 { background-color: #0891b2 !important; }
        .bg-cyan-950 { background-color: #083344 !important; }
        .text-cyan-400 { color: #22d3ee !important; }
        .text-slate-100 { color: #f8fafc !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .text-rose-400 { color: #fb7185 !important; }
        .border-slate-700 { border-color: #334155 !important; }
        .border-cyan-800 { border-color: #155e75 !important; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
            background-color: #0f172a !important; color: #ffffff !important; border: 1px solid #334155 !important; border-radius: 0.5rem;
        }
        input:focus { border-color: #06b6d4 !important; outline: none; }
        button { cursor: pointer; }
        a { text-decoration: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <i class="fa-solid fa-shield-cat text-cyan-400 text-4xl"></i>
            <h2 class="text-2xl font-bold text-slate-100">Đăng Ký Tài Khoản</h2>
            <div class="inline-block text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded-full">
                Security Level 5 Required
            </div>
        </div>

        <form onsubmit="auth.handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tên Đăng Nhập *</label>
                <input type="text" id="reg-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email / Gmail *</label>
                <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Số Điện Thoại *</label>
                <input type="tel" id="reg-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Mật Khẩu Cấp 5 *</label>
                <input type="password" id="reg-password" required placeholder="Tối thiểu 12 ký tự: HOA, thường, số, đặc biệt" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none">
            </div>

            <div id="reg-error" class="hidden text-xs text-rose-400 bg-slate-900 border border-rose-800 p-3 rounded-lg"></div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-md flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>Tạo Tài Khoản Mới</span>
            </button>
        </form>

        <div class="text-center text-xs text-slate-400">
            Đã có tài khoản? <a href="login.html" class="text-cyan-400 hover:underline font-semibold">Đăng nhập ngay</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            db.clearSession();
        });
    </script>
</body>
</html>
