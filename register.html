<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Kỳ | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; }
        input:focus, select:focus { border-color: #06b6d4 !important; outline: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-8 shadow-2xl space-y-5">
        <!-- Logo & Header -->
        <div class="text-center space-y-1">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-slate-900 rounded-full border border-slate-700 text-cyan-400 text-2xl mb-1 shadow-inner">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-bold text-cyan-400">Tạo Tài Khoản Mới</h1>
            <p class="text-xs text-slate-400">Yêu cầu mật khẩu chuẩn Cấp 5 (≥12 ký tự, HOA, thường, số, đặc biệt)</p>
        </div>

        <!-- Form Đăng Kỳ -->
        <form onsubmit="handleRegister(event)" class="space-y-3.5">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Tên tài khoản (Username) (*)</label>
                <input type="text" id="reg-username" required placeholder="Tên đăng nhập..." class="w-full rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email liên hệ</label>
                <input type="email" id="reg-email" placeholder="Địa chỉ email..." class="w-full rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Số điện thoại</label>
                <input type="tel" id="reg-phone" placeholder="Số điện thoại..." class="w-full rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Mật khẩu Cấp 5 (*)</label>
                <input type="password" id="reg-password" required placeholder="Tối thiểu 12 ký tự..." class="w-full rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Chọn Icon đại diện</label>
                <select id="reg-icon" class="w-full rounded-xl px-3 py-2 text-sm focus:ring-1 focus:ring-cyan-500 cursor-pointer">
                    <option value="fa-solid fa-shield-cat">🐱 Mèo Bảo Mật</option>
                    <option value="fa-solid fa-user-ninja">🥷 Ninja</option>
                    <option value="fa-solid fa-robot">🤖 Robot</option>
                    <option value="fa-solid fa-crown">👑 Vương Miện</option>
                    <option value="fa-solid fa-ghost">👻 Con Ma</option>
                    <option value="fa-solid fa-dragon">🐉 Con Rồng</option>
                </select>
            </div>

            <button type="submit" id="btn-reg-submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-xl shadow-lg transition-all text-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-check-double"></i> Hoàn Tất Đăng Kỳ
            </button>
        </form>

        <!-- Chuyển hướng -->
        <div class="text-center pt-3 border-t border-slate-700">
            <p class="text-xs text-slate-400">Đã có tài khoản? <a href="login.html" class="text-cyan-400 hover:underline font-semibold">Đăng nhập ngay</a></p>
        </div>
    </div>

    <!-- SDK Firebase & JS Logic -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Tự động chuyển hướng nếu đã có phiên làm việc
        document.addEventListener('DOMContentLoaded', () => {
            if (db.getSession()) {
                window.location.href = 'home.html';
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-reg-submit');
            const u = document.getElementById('reg-username').value.trim();
            const em = document.getElementById('reg-email').value.trim();
            const ph = document.getElementById('reg-phone').value.trim();
            const p = document.getElementById('reg-password').value;
            const ic = document.getElementById('reg-icon').value;

            if (!u || !p) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo tài khoản...`;

            try {
                await auth.register(u, em, ph, p, ic);
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check-double"></i> Hoàn Tất Đăng Kỳ`;
            }
        }
    </script>
</body>
</html>
