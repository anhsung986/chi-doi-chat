<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { background-color: #0f172a !important; color: #f8fafc !important; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
        input[type="text"], input[type="password"] { background-color: #0f172a !important; color: #fff !important; border: 1px solid #334155 !important; }
        input:focus { border-color: #06b6d4 !important; outline: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-8 shadow-2xl space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-full border border-slate-700 text-cyan-400 text-3xl mb-1 shadow-inner">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
            <h1 class="text-2xl font-bold text-cyan-400">CHI DOI CHAT</h1>
            <p class="text-xs text-slate-400">Hệ thống nhắn tin bảo mật mã hóa AES-256</p>
        </div>

        <!-- Form Đăng Nhập -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Tên tài khoản (Username)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user text-xs"></i></span>
                    <input type="text" id="login-username" required placeholder="Nhập tên tài khoản..." class="w-full rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-1 focus:ring-cyan-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Mật khẩu bảo mật</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock text-xs"></i></span>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu..." class="w-full rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-1 focus:ring-cyan-500">
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-3 rounded-xl shadow-lg transition-all text-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
            </button>
        </form>

        <!-- Chuyển hướng -->
        <div class="text-center pt-3 border-t border-slate-700">
            <p class="text-xs text-slate-400">Chưa có tài khoản? <a href="register.html" class="text-cyan-400 hover:underline font-semibold">Đăng ký ngay</a></p>
        </div>
    </div>

    <!-- SDK Firebase & JS Logic -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Tự động chuyển hướng nếu đã đăng nhập từ trước
        document.addEventListener('DOMContentLoaded', () => {
            if (db.getSession()) {
                window.location.href = 'home.html';
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;

            if (!u || !p) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...`;

            try {
                await auth.login(u, p);
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập`;
            }
        }
    </script>
</body>
</html>
