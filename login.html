<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | CHI DOI CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <div class="text-center mb-6">
            <i class="fa-solid fa-shield-cat text-cyan-400 text-3xl mb-2"></i>
            <h2 class="text-2xl font-bold text-white">Đăng Nhập Tài Khoản</h2>
            <p class="text-xs text-slate-400 mt-1">Xác thực mã hóa SHA-256 bảo mật Cấp 5</p>
        </div>

        <form onsubmit="auth.handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Tên đăng nhập / Email</label>
                <input type="text" id="login-id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Mật khẩu</label>
                <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none">
            </div>

            <div id="login-error" class="text-rose-400 text-xs p-2 bg-rose-950/40 border border-rose-800/50 rounded hidden"></div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 rounded-lg transition shadow-md">
                Xác Thực & Vào Chat
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            Chưa có tài khoản? <a href="register.html" class="text-cyan-400 hover:underline">Đăng ký ngay</a>
        </div>
    </div>

    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
